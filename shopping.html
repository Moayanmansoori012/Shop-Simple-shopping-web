<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSimple</title>
    <link rel="stylesheet" href="shop.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>
    <div class="main">
        <div class="navbar">
            <div class="first-section">
                <h2>Shop</h2>
                <h2 id="hand"> Simple</h2>
            </div>
            <div class="second-section">
                <a href="./first.html">Home</a>
                <a href="./shopping.html">About</a>
                <a href="./asad.html">Contact</a>
                <a href="./home.html">Shop</a>
                <i class="fa-solid fa-cart-shopping"></i>
            </div>
        </div>
        <div class="word">
            <div class="secmain">
                <p id="house">Home/Shop/Blue T-shirt</p>
                <div>
                    <img src="img2.jpg" alt="" height="400" width="">



                </div>
            </div>
            <div class="bottom">
                <h2>Blue T-Shirt</h2><br>
                <h3 id="rup">$19.99</h3>
                <br>
                <p>This is a high quality blue t-shirt <br> made with 100% cotton fabric. <br> Comfortable and perfect
                    for everday use </p>
                <br>
                <h3>Size</h3>
                <br>
                <div>
                    <button class="button">S</button>
                    <button class="button" id="men">M</button>
                    <button class="button">L</button>
                    <button class="button">XL</button>
                </div>
                <div>
                    <br>
                    <br>

                    <h2>Quantity</h2>
                </div>
                <br>
                <div class="quantity">
                    <button id="min"></button>

                    <input type="text" name="" id="quantity" value="1" readonly>
                    <button id="plus">+</button>
                </div>




                <br>
                <br>
                <button id="add">Add to Cart</button>
                <button id="buy">Buy Now</button>
            </div>
        </div>
    </div>
    <div class="op">
        <button><img src="img2.jpg" alt="" width="50"></button>

        <button><img src="img1.jpg" alt="" width="50"></button>


        <button><img src="img3.jpg" alt="" width=50"></button>


        <button><img src="img4.jpg" alt="" width="50"></button>

    </div>

</body>

</html>
